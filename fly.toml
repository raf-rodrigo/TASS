# fly.toml app configuration file generated for tass-app-twilight-canyon-5020 on 2026-10-23T16:14:24-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tass-app-twilight-canyon-5020'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TASS_DB_PATH = '/data/tass-db.json'

[[mounts]]
  source = 'tass_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
