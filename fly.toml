# fly.toml app configuration file for TASS
# Reference: https://fly.io/docs/reference/configuration/

app = "tass-app"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TASS_DB_PATH = "/data/tass-db.json"

[[mounts]]
  source = "tass_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
